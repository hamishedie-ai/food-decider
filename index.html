<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Food Decider</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column, a quiz card that turns into a kitchen order docket at the end */
:root{
  --bg:#F4F1F7; --card:#FFFFFF; --ink:#1F1B36; --muted:#6B6582; --line:#E2DCEA;
  --accent:#E2456F; --accent-ink:#FFFFFF; --sun:#F4B42A; --soft:#FBE7EE; --docket:#FFFDF6;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16132A; --card:#211D3A; --ink:#F2EEF9; --muted:#A79FC2; --line:#352F55;
  --accent:#FF6D93; --accent-ink:#1A1530; --sun:#FFC94A; --soft:#3A2440; --docket:#26213F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16132A; --card:#211D3A; --ink:#F2EEF9; --muted:#A79FC2; --line:#352F55;
  --accent:#FF6D93; --accent-ink:#1A1530; --sun:#FFC94A; --soft:#3A2440; --docket:#26213F; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(40px,11vw,64px);line-height:.95;font-weight:800}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:clamp(26px,7vw,34px);line-height:1.08;font-weight:800}
h3{font-size:20px;font-weight:800}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:18px}
.btn{font:600 16px var(--body);border:0;border-radius:999px;padding:15px 22px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tab:focus-visible,.meal:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.dodge{position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-size:13px;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meal{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-radius:18px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font:600 16px var(--body);cursor:pointer;transition:border-color .15s,transform .15s}
.meal:hover{border-color:var(--accent)}
.meal:active{transform:scale(.97)}
.meal .e{font-size:30px}
.meal small{font:400 12px var(--mono);color:var(--muted)}
.meal.now{border-color:var(--accent);background:var(--soft)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .35s}
.qhead{display:flex;justify-content:space-between;gap:8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:500 16px var(--body);color:var(--ink);
  background:transparent;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.opt:active{transform:scale(.98)}
.opt .e{font-size:24px;width:30px;text-align:center;flex:none}
.opt .t{display:flex;flex-direction:column;min-width:0}
.opt .t small{color:var(--muted);font-size:13px;font-weight:400}
.linkbtn{background:none;border:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;padding:4px 0;align-self:flex-start}
/* docket */
.docket{background:var(--docket);border-radius:18px;padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.dk-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1.5px dashed var(--line);padding-bottom:10px;gap:8px}
.verdict{display:flex;gap:14px;align-items:center}
.verdict .big{font-size:46px;flex:none}
.persona{font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.flagline{font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:999px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:10px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.place{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px dashed var(--line)}
.place:first-child{border-top:0;padding-top:4px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.place .nm{font-family:var(--display);font-weight:800;font-size:19px;min-width:0}
.place .addr{font-family:var(--mono);font-size:13px;color:var(--muted)}
.place a{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}
.place a:hover{text-decoration:underline}
.price{display:flex;align-items:center;gap:6px;flex:none}
.price .bars{display:flex;gap:3px}
.price .bars i{display:block;width:10px;height:14px;border-radius:3px;background:var(--line)}
.price .bars i.on{background:var(--sun)}
.price .lbl{font-family:var(--mono);font-size:12px;color:var(--muted);width:40px;text-align:right}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);margin-right:4px}
.best{background:var(--sun);color:#1F1B36}
.shop{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.shop li::marker{color:var(--accent)}
.shop .q{color:var(--muted);font-size:14px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ol.steps li::marker{font-family:var(--mono);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px var(--body);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.tell{background:var(--soft);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.fade{animation:none}.dodge,.progress span{transition:none}}
.foot{text-align:center;font-size:12px;color:var(--muted)}
</style>

const VIBE_TAB = {date:"Book a table", casual:"Head out", takeaway:"Order in", home:"Cook it"};
const PRICE_LBL = ["","$","$$","$$$","$$$$","$$$$$"];

/* ---------- State ---------- */
let answers = {}, step = -1, ranked = [], current = 0, tab = "out", dodges = 0;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* ---------- Scoring ---------- */
function score(d, a){
  let s = Math.random()*1.5;
  if (a.cuisine && a.cuisine!=="any"){ if (d.cuisine===a.cuisine) s+=6; else if (d.cuisine!=="any") s-=3; }
  const sweetDish = d.crav[0]==="sweet";
  if (a.craving==="sweet") s += d.crav.includes("sweet") ? 10 : -4;
  else { if (sweetDish) s-=6; if (d.crav.includes(a.craving)) s+=5; }
  const target = {starving:3, meal:2.5, peckish:1.5, snack:1}[a.hunger] ?? 2;
  s -= Math.abs(d.size-target)*1.5;
  if (["date","casual","takeaway"].includes(a.vibe)) s += d.places.some(p=>p.vibes.includes(a.vibe)) ? 3 : -2;
  return s;
}
function decide(){
  ranked = DISHES.filter(d=>d.meals.includes(answers.meal))
    .map(d=>({d, s:score(d,answers)})).sort((x,y)=>y.s-x.s).map(x=>x.d);
  current = 0;
  tab = answers.vibe==="home" ? "cook" : "out";
  render();
}

/* ---------- Views ---------- */
function render(){
  if (step<0) return renderStart();
  if (step<activeQs().length) return renderQ();
  renderResult();
}

function guessMeal(){ const h=new Date().getHours(); return h<11?"breakfast":h<16?"lunch":"dinner"; }

function renderStart(){
  const now = guessMeal();
  app.innerHTML = `
  <div class="hero fade">
    <div class="eyebrow">✦ A tiny quiz for a very big question ✦</div>
    <h1>What do you<br><em>want to eat?</em></h1>
    <p>A few quick questions. At the end you get a spot around Hobart that does it, or a short shopping list to make it together.</p>
    <div class="eyebrow" style="margin-top:6px">Which meal are we deciding?</div>
    <div class="meals">${Object.entries(MEALS).map(([k,[e,l]])=>`
      <button class="meal ${k===now?"now":""}" data-m="${k}"><span class="e" aria-hidden="true">${e}</span>${l}<small>${k===now?"right now":"&nbsp;"}</small></button>`).join("")}
    </div>
    <div class="row">
      <button class="btn ghost dodge" id="idk">Idk, you choose</button>
    </div>
    <p class="small" id="idkmsg">No wrong answers. Except "you decide".</p>
  </div>`;
  app.querySelectorAll(".meal").forEach(b=>b.onclick=()=>{ answers={meal:b.dataset.m}; step=0; render(); });
  const idk = document.getElementById("idk");
  const run = (ev)=>{
    ev.preventDefault(); dodges++;
    const x = (Math.random()*120-60)|0, y=(Math.random()*40-20)|0;
    idk.style.transform = `translate(${x}px,${y}px) rotate(${x/6}deg)`;
    document.getElementById("idkmsg").textContent = ["Nice try.","Nope, still your call.","Okay okay, you win."][dodges-1];
    if (dodges>=3){ idk.style.transform="none"; idk.textContent="Fine, pick for me 🎲"; }
  };
  idk.addEventListener("pointerenter", e=>{ if(e.pointerType==="mouse" && dodges<3) run(e); });
  idk.addEventListener("click", e=>{
    if (dodges<3) return run(e);
    answers = {meal:now, hunger:"meal", craving:pick(["salty","cheesy","fresh","warm","spicy"]), vibe:"any", cuisine:"any"};
    step = 99; decide();
  });
}

function renderQ(){
  const qs = activeQs(), Q = qs[step], n = step+1, pct = Math.round(n/qs.length*100);
  app.innerHTML = `
  <div class="card fade">
    <div class="qhead"><span class="eyebrow">${MEALS[answers.meal][0]} Question ${n} of ${qs.length}</span><span class="eyebrow">${pct}% decided</span></div>
    <div class="progress"><span style="width:${pct}%"></span></div>
    <div class="eyebrow">Q0${n} · ${esc(Q.label)}</div>
    <h2>${esc(Q.q(answers.meal))}</h2>
    <p class="small">${esc(Q.sub)}</p>
    <div class="opts">${Q.opts.map(([v,e,t,s])=>`
      <button class="opt" data-v="${v}"><span class="e" aria-hidden="true">${e}</span><span class="t">${esc(t)}${s?`<small>${esc(s)}</small>`:""}</span></button>`).join("")}
    </div>
    <button class="linkbtn" id="back">← Back</button>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    answers[Q.id]=b.dataset.v; step++;
    if (step>=qs.length) decide(); else render();
  });
  document.getElementById("back").onclick=()=>{ step--; render(); };
}

function mapsUrl(p){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.name+" "+(p.addr.includes(",")?p.addr:"Hobart TAS")); }
function sortedPlaces(d){ const v=answers.vibe; return [...d.places].sort((a,b)=>(b.vibes.includes(v)?1:0)-(a.vibes.includes(v)?1:0)); }
function priceBar(n){
  return `<span class="price" title="Price: ${n} of 5" aria-label="Price ${n} out of 5">
    <span class="bars">${[1,2,3,4,5].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>
    <span class="lbl">${PRICE_LBL[n]}</span></span>`;
}

function renderResult(){
  const d = ranked[current];
  const backups = ranked.filter((_,i)=>i!==current).slice(0,3);
  const meal = MEALS[answers.meal][1];
  const time = new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const places = sortedPlaces(d);
  app.innerHTML = `
  <div class="docket fade">
    <div class="dk-top"><span>${meal.toUpperCase()} ORDER</span><span>TABLE FOR 2</span><span>${esc(time)}</span></div>
    <div class="eyebrow">Your perfect ${meal.toLowerCase()} match is…</div>
    <div class="verdict"><span class="big" aria-hidden="true">${d.e}</span>
      <div><div class="persona">${esc(d.persona)}</div><h2>${esc(d.name)}</h2><div class="flagline">${d.flag} ${esc(d.country)}</div></div></div>
    <p>${esc(d.plan)}</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-out" aria-selected="${tab==="out"}">📍 ${esc(answers.vibe==="home"?"Go out instead":(VIBE_TAB[answers.vibe]||"Go out"))}</button>
      <button class="tab" role="tab" id="t-cook" aria-selected="${tab==="cook"}">🛒 ${answers.vibe==="home"?"Cook it":"Cook it instead"}</button>
    </div>
    <div id="panel"></div>
  </div>

  <div class="card fade">
    <h3>Backup options (because options)</h3>
    <div class="chips">${backups.map(b=>`<button class="chip" data-id="${b.id}">${b.flag} ${b.e} ${esc(b.name)}</button>`).join("")}</div>
  </div>

  <div class="tell fade">
    <h3>Now go tell your boyfriend 💌</h3>
    <button class="btn primary" id="copyplan">Copy my food match</button>
    <p class="small">Paste it into your messages. You're in charge of the delivery.</p>
  </div>

  <div class="row" style="justify-content:center">
    <button class="btn ghost" id="nope">That's not what I want 😩</button>
    <button class="btn ghost" id="again">Start over ↻</button>
  </div>
  <p class="foot">Places picked from Hobart food guides. Price bar is a rough guide compared with the other places in this app. Check opening hours before you go.</p>`;

  const panel = document.getElementById("panel");
  if (tab==="out"){
    panel.innerHTML = places.map((p,i)=>`
      <div class="place">
        <div>${i===0?'<span class="tag best">Top pick</span>':""}${p.vibes.map(v=>`<span class="tag">${{date:"date",casual:"casual",takeaway:"takeaway"}[v]}</span>`).join("")}</div>
        <div class="phead"><div class="nm">${esc(p.name)}</div>${priceBar(p.price)}</div>
        <div class="addr">${esc(p.addr)}</div>
        <p>${esc(p.note)}</p>
        <a href="${mapsUrl(p)}" target="_blank" rel="noopener">Open in Maps ↗</a>
      </div>`).join("");
  } else {
    const r = d.recipe;
    panel.innerHTML = `
      <p class="small">Serves 2 · ${esc(r.time)}</p>
      <h3 style="margin-top:12px">Shopping list</h3>
      <ul class="shop">${r.buy.map(([n,q])=>`<li>${esc(n)} <span class="q">· ${esc(q)}</span></li>`).join("")}</ul>
      <p class="small" style="margin-top:8px">From the cupboard: ${esc(r.pantry)}</p>
      <div class="row" style="margin-top:14px"><button class="btn primary" id="copylist">Copy shopping list</button></div>
      <h3 style="margin-top:18px">How to make it</h3>
      <ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`;
    document.getElementById("copylist").onclick = ()=>copy(listText(d), "Shopping list copied");
  }

  document.getElementById("t-out").onclick=()=>{ tab="out"; renderResult(); };
  document.getElementById("t-cook").onclick=()=>{ tab="cook"; renderResult(); };
  app.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ current = ranked.findIndex(x=>x.id===c.dataset.id); renderResult(); window.scrollTo({top:0,behavior:"smooth"}); });
  document.getElementById("nope").onclick=()=>{ current=(current+1)%ranked.length; renderResult(); window.scrollTo({top:0,behavior:"smooth"}); };
  document.getElementById("again").onclick=()=>{ step=-1; dodges=0; answers={}; render(); };
  document.getElementById("copyplan").onclick=()=>{
    const p = places[0];
    const txt = tab==="cook"
      ? `💌 My ${meal.toLowerCase()} match: ${d.flag} ${d.e} ${d.name}\nWe're cooking! ${listText(d)}`
      : `💌 My ${meal.toLowerCase()} match: ${d.flag} ${d.e} ${d.name}\n${d.plan}\nTake me to ${p.name}, ${p.addr} 🥺`;
    copy(txt, "Copied. Go send it!");
  };
}
function listText(d){ return `🛒 ${d.name}\n` + d.recipe.buy.map(([n,q])=>`• ${n} (${q})`).join("\n"); }

/* ---------- Helpers ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2000); }
function copy(text, ok){
  const fallback=()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
    let done=false; try{ done=document.execCommand("copy"); }catch(e){} ta.remove(); toast(done?ok:"Couldn't copy. Screenshot it instead!"); };
  try{ navigator.clipboard.writeText(text).then(()=>toast(ok), fallback); }catch(e){ fallback(); }
}

render();
</script>
